<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ig:linear-gradient(90deg,#e91e8c,#a855f7);--ok:#16a34a;--chip:#e8efff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#171b24;--text:#f3f4f6;--mute:#9ca3af;--line:#262c38;--chip:#1e2a52}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#171b24;--text:#f3f4f6;--mute:#9ca3af;--line:#262c38;--chip:#1e2a52}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
nav.top{display:flex;align-items:center;gap:12px;padding:12px max(12px,calc(50% - 520px));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin-right:auto;white-space:nowrap}
.lg{width:32px;height:32px;border-radius:10px;background:var(--ig);display:grid;place-items:center;flex:none}
nav.top a.l{font-size:13px;color:var(--mute)}@media(max-width:420px){.logo{font-size:15px}.lg{width:28px;height:28px}}
.btn{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--acc);color:#fff;display:inline-block;white-space:nowrap;text-align:center}

const ta=(k,v,mx)=>`<textarea data-i="${k}" maxlength="${mx}">${esc(v)}</textarea>`,ip=(k,v,ph,c)=>`<input type="text" data-i="${k}" value="${esc(v)}" placeholder="${ph||''}" class="${c||''}">`;
const fprev=()=>{const f=W.file;if(!f)return '';const u=PV[f.id];return (u&&f.type.indexOf('image')==0?`<img src="${u}" alt="" style="max-width:100%;max-height:150px;border-radius:10px;margin-top:8px;display:block">`:'')+`<div class="row between" style="margin-top:8px;flex-wrap:nowrap"><span style="word-break:break-all">📎 ${esc(f.name)} <span class="sub">(${fmtB(f.size||0)})</span></span><button class="btn sm sec" id="wrmf">Remove</button></div>`};
const loadPv=()=>{const f=W.file;if(!f||PV[f.id]||f.type.indexOf('image')!=0)return;idbDo('get',f.id).then(b=>{if(b&&W.file&&W.file.id==f.id&&!PV[f.id]){PV[f.id]=URL.createObjectURL(b);const p=$('wprev');if(p)p.innerHTML=fprev()}}).catch(()=>{})};
function wbody(){const s=W.s;
if(s==1)return `<h2>Select a trigger</h2>${rc(W.trig=='specific','trig','specific','A specific post or reel',`<div class="pv" style="margin:10px 0 0"><span class="th" style="background:${rgrad(W.i)}"></span><span class="sub">${esc(REELS[W.i][0])}</span></div>`)}${rc(W.trig=='any','trig','any','Any post or reel')}`;
if(s==2)return `<h2>Matching</h2>${rc(W.match=='words','match','words','A specific word or words',W.match=='words'?`<input type="text" id="kwin" placeholder="Enter a word or multiple..." style="margin-top:10px"><label>Use commas to separate words</label><p class="sub" style="margin:0 0 10px">Skip some comments: add !word. Example: price, cost, !free replies to price or cost, but not when the comment says free.</p><div class="row">${['Price','Link','Shop','Info'].map(q=>`<button class="btn sec sm" data-q="${q.toLowerCase()}">+ ${q}</button>`).join('')}</div><div class="chips">${W.kws.map((k,j)=>`<span class="chip">${esc(k)}<b data-x="${j}">×</b></span>`).join('')}</div>`:'')}${rc(W.match=='any','match','any','Any word')}${tg('pub','Public reply to comments','Randomly picks from your templates')}${W.pub?ta('pubT',W.pubT,640)+'<p class="sub">One line = one template.</p>':''}${tg('own','Ignore my own comments','Prevents self-automation loops')}`;
if(s==3)return `<h2>Auto-reply</h2><div class="card"><label style="margin-top:0">Opening message</label>${ta('open',W.open,640)}<div class="row between" style="margin-top:8px"><label style="margin:0">Character count</label><span class="tag" id="cc1">${W.open.length}/640</span></div><label>Button text</label>${ip('obt',W.obt,'','ctr')}</div>${tg('ff','Require Follow First','Users must follow to unlock content')}${W.ff?`<div class="card tint"><div class="pv"><span class="th" style="background:${rgrad(W.i)}"></span><div id="pvm">${esc(W.fm)}</div></div><div class="row"><span class="btn sm" id="pvf">${esc(W.fb)}</span><span class="btn sec sm" id="pvv">${esc(W.vb)}</span></div><label>Follow-gate message</label>${ta('fm',W.fm,640)}<div class="c2"><div><label>Follow button text</label>${ip('fb',W.fb)}</div><div><label>Verify button text</label>${ip('vb',W.vb)}</div></div><label>Not following yet — retry message</label>${ta('rm',W.rm,640)}</div>`:''}`;
return `<h2>And then, they will get...</h2><div class="card"><b>🔗 FINAL REWARD (THE LINK)</b><label>Final message</label>${ta('fin',W.fin,1000)}<div class="row between" style="margin-top:8px"><label style="margin:0">Text limit</label><span class="tag" id="cc4">${W.fin.length}/1000</span></div><label>Destination URL</label>${ip('url',W.url,'https://yourwebsite.com/guide')}<label>Button text</label>${ip('fbt',W.fbt,'','ctr')}${W.btns.map((b,j)=>`<div class="c2" style="margin-top:10px"><input type="text" data-bi="${j}" data-bf="t" value="${esc(b.t)}" placeholder="Button text"><div class="row" style="flex-wrap:nowrap"><input type="text" data-bi="${j}" data-bf="u" value="${esc(b.u)}" placeholder="https://"><button class="btn sm sec" data-rb="${j}">✕</button></div></div>`).join('')}${W.btns.length<2?'<button class="btn dash" id="addb">+ Add Another Button</button>':''}<hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="row between"><label style="margin:0">📎 Attachment (optional)</label><span class="sub">max 20 MB</span></div><div class="row" style="margin-top:8px"><span class="tag">Image</span><span class="tag">PDF / File</span><span class="tag">Voice Note</span><span class="tag">Reel / Video</span></div><div class="c2" style="margin-top:10px"><input type="text" data-i="furl" value="${esc(W.furl)}" placeholder="Upload a file or paste URL"><button class="btn dash" id="wup" style="margin:0">⬆ Upload File</button></div><input type="file" id="wfile" class="hide" accept="image/*,.pdf,audio/*,video/*"><div class="sub" style="margin-top:8px">Upload a PDF, voice note, video or image directly. Max 20 MB.</div><div id="wprev">${fprev()}</div><p class="sub" style="margin:10px 0 0">Attach a PDF document, voice note (.mp3/.m4a), reel/video (.mp4), or image delivered natively in the final DM.</p></div>${tg('fu','Follow up DM after 24h','Re-engage leads who didn’t click')}${W.fu?ta('fut',W.fut,640):''}${W.edit?'<button class="btn sec" id="wdel" style="width:100%">Delete this automation</button>':''}`}
function wr(){const old=$('wbd')?$('wbd').scrollTop:0,pk=$('kwin')?$('kwin').value:'',s=W.s;$('rm').innerHTML=`<div class="wz"><div class="wh"><div class="row between" style="flex-wrap:nowrap"><div><b style="font-size:21px">Create Automation</b><div class="sub" style="letter-spacing:.12em;font-weight:700">${['TRIGGER','MATCHING','AUTO-REPLY','LOGIC SETTINGS'][s-1]}</div></div><button class="btn sm sec" id="wx">✕</button></div><div class="pg">${[1,2,3,4].map(n=>`<i class="${n<=s?'on':''}"></i>`).join('')}</div><div class="sub">Step ${s} of 4</div></div><div class="wb" id="wbd">${wbody()}</div><div class="wf">${s>1?'<button class="btn sec" id="wbk">‹ Back</button>':''}<button class="btn" id="wnx">${s<4?'Next ›':'Launch Automation'}</button></div></div>`;$('wbd').scrollTop=old;if($('kwin'))$('kwin').value=pk;wbind();if(s==4)loadPv()}
const pend=()=>{const el=$('kwin');if(el&&el.value.trim()){el.value.split(',').forEach(x=>{x=x.trim().toLowerCase();if(x&&!W.kws.includes(x))W.kws.push(x)});el.value=''}};
const closeW=()=>{NEWF.forEach(id=>dropFile({id}));NEWF=[];$('rm').classList.add('hide');$('rm').innerHTML=''};
function wbind(){$('wx').onclick=closeW;if($('wbk'))$('wbk').onclick=()=>{pend();W.s--;wr()};
$('wnx').onclick=()=>{if(W.s==2){pend();if(W.match=='words'&&!W.kws.length){toast('Add at least one word.');return}}if(W.s<4){W.s++;wr();$('wbd').scrollTop=0;return}wlaunch()};
const b=$('wbd');
b.onclick=e=>{const t=e.target,q=t.closest('[data-q]');if(q){pend();const v=q.dataset.q;if(!W.kws.includes(v))W.kws.push(v);wr();return}
const x=t.closest('[data-x]');if(x){W.kws.splice(+x.dataset.x,1);wr();return}
const k=t.closest('[data-k]');if(k){pend();W[k.dataset.k]=!W[k.dataset.k];wr();return}
if(t.id=='addb'){W.btns.push({t:'',u:''});wr();return}
if(t.id=='wup'){$('wfile').click();return}
const rb=t.closest('[data-rb]');if(rb){W.btns.splice(+rb.dataset.rb,1);wr();return}
if(t.id=='wrmf'){const o=W.file;if(o&&NEWF.includes(o.id)){dropFile(o);NEWF=NEWF.filter(x=>x!=o.id)}W.file=null;wr();return}
if(t.id=='wdel'){const o=D.autos.find(a=>a.reel===W.i);if(o&&o.cfg)dropFile(o.cfg.file);D.autos=D.autos.filter(a=>a.reel!==W.i);save();closeW();render();return}
const r=t.closest('[data-rk]');if(r&&!t.closest('input,textarea,button')){pend();W[r.dataset.rk]=r.dataset.rv;wr()}};
b.oninput=e=>{const t=e.target,i=t.dataset.i;if(i){W[i]=t.value;if(i=='open')$('cc1').textContent=t.value.length+'/640';if(i=='fin')$('cc4').textContent=t.value.length+'/1000';if(i=='fm'&&$('pvm'))$('pvm').textContent=t.value;if(i=='fb'&&$('pvf'))$('pvf').textContent=t.value;if(i=='vb'&&$('pvv'))$('pvv').textContent=t.value}if(t.dataset.bi!==undefined)W.btns[+t.dataset.bi][t.dataset.bf]=t.value};
b.onkeydown=e=>{if(e.target.id=='kwin'&&(e.key=='Enter'||e.key==',')){e.preventDefault();pend();wr()}};
b.onchange=e=>{const t=e.target;if(t.id!='wfile')return;const f=t.files[0];t.value='';if(!f)return;
if(f.size>MAXF){toast('File is too large ('+(f.size/1048576).toFixed(2)+' MB). Please choose a file up to 20 MB.');return}
if(!f.size){toast('This file is empty.');return}
if(!(/^(image|audio|video)\//.test(f.type)||f.type=='application/pdf'||/\.(pdf|mp3|m4a|mp4|mov|png|jpe?g|gif|webp)$/i.test(f.name))){toast('Only image, PDF, audio or video files are allowed.');return}
const id='f'+Date.now()+Math.random().toString(36).slice(2,7);
idbDo('put',id,f).then(()=>{const old=W.file;if(old&&NEWF.includes(old.id)){dropFile(old);NEWF=NEWF.filter(x=>x!=old.id)}NEWF.push(id);W.file={id,name:f.name,type:f.type||'file',size:f.size};if(f.type.indexOf('image')==0)PV[id]=URL.createObjectURL(f);const p=$('wprev');if(p)p.innerHTML=fprev();toast('File added ✅')}).catch(()=>toast('Could not store the file in this browser (storage full or private mode).'))}}
function wlaunch(){const nu=u=>{u=(u||'').trim();return u&&!/^https?:\/\//i.test(u)?'https://'+u:u},bad=u=>{if(!u)return false;try{new URL(u);return false}catch(e){return true}};
const url=nu(W.url),furl=nu(W.furl),btns=W.btns.map(b=>({t:(b.t||'').trim(),u:nu(b.u)})).filter(b=>b.t||b.u),m=[];
if(!W.fin.trim())m.push('final message');if(!url&&!W.file&&!furl)m.push('a link or file');if(m.length){toast('Please add '+m.join(' and ')+'.');return}
if(bad(url)||bad(furl)||btns.some(b=>bad(b.u))){toast('One of the links is not a valid URL.');return}
if(btns.some(b=>!b.t||!b.u)){toast('Each extra button needs both text and a link.');return}
const prev=D.autos.find(a=>a.reel===W.i);if(prev&&prev.cfg&&prev.cfg.file&&(!W.file||prev.cfg.file.id!==W.file.id))dropFile(prev.cfg.file);
NEWF.filter(x=>!W.file||x!==W.file.id).forEach(id=>dropFile({id}));NEWF=[];
D.autos=D.autos.filter(a=>a.reel!==W.i);const c=JSON.parse(JSON.stringify(W));c.url=url;c.furl=furl;c.btns=btns;c.edit=true;D.autos.push({name:REELS[W.i][0],trig:W.trig=='any'?'Any reel':'Specific reel',kws:W.match=='any'?'Any word':W.kws.join(', '),on:true,reel:W.i,link:!!(url||furl),cfg:c});save();closeW();toast('Automation is live ✅');render()}
function openM(i){const a=D.autos.find(x=>x.reel===i);W=wNew(i,a&&a.cfg?JSON.parse(JSON.stringify(a.cfg)):null);W.s=1;W.i=i;$('rm').classList.remove('hide');wr()}
function matches(a,t){const c=a.cfg;if(!c||c.match=='any')return true;t=t.toLowerCase();const inc=[],exc=[];c.kws.forEach(k=>k[0]=='!'?exc.push(k.slice(1)):inc.push(k));if(exc.some(x=>t.includes(x)))return false;return !inc.length||inc.some(x=>t.includes(x))}
function tsheet(i){const a=D.autos[i],d=document.createElement('div');d.className='mod';d.innerHTML=`<div class="sheet"><b>Test: ${esc(a.name)}</b><p class="sub">Pretend someone comments:</p><input type="text" id="tcm" placeholder="${esc(a.kws.split(',')[0])}"><div class="row" style="margin-top:10px"><button class="btn" id="tchk">Check</button><button class="btn sec" id="tcls">Close</button></div><div id="tout" class="sub" style="margin-top:10px;white-space:pre-line"></div></div>`;document.body.appendChild(d);
$('tcls').onclick=()=>{d.remove();render()};
$('tchk').onclick=()=>{const t=$('tcm').value,c=a.cfg||{};let o;if(!a.on)o='This automation is off.';else if(!matches(a,t))o='❌ No match. No DM will be sent.';else{const L=['✅ Match'];if(c.pub)L.push('Public reply: '+c.pubT.split(NL)[0]);if(c.ff)L.push('Follow gate: '+c.fm);L.push('DM: '+c.open.split(NL)[0]);L.push('Button: '+c.obt);L.push('Then: '+c.fin+(c.url?' ['+c.fbt+'] '+c.url:''));(c.btns||[]).forEach(x=>L.push('Button: ['+x.t+'] '+x.u));if(c.file)L.push('File: '+c.file.name+' ('+fmtB(c.file.size||0)+')');else if(c.furl)L.push('Attachment: '+c.furl);if(c.fu)L.push('Follow-up after 24h');sendDm(a);o=L.join(NL)}$('tout').textContent=o}}
function render(keep){let r=location.hash.slice(1)||'home';if(!P[r])r='home';if(!D.user&&!D.guest)r='login';else if(r=='login')r='home';if(APPR.includes(r)&&!D.conn){location.hash='connect';return}$('root').innerHTML=(APPR.includes(r)?shell(r,P[r]()):P[r]())+((APPR.includes(r)||r=='login')?`<footer class="ft">${dvf()}</footer>`:'');if(B[r])B[r]();if(keep!==true)window.scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target,m=$('pfm'),b=t.closest('[data-pf]');
  if(b&&m){const r=b.getBoundingClientRect();m.style.top=(r.bottom+8)+'px';m.style.right=Math.max(8,innerWidth-r.right)+'px';m.classList.toggle('hide');return}
  if(t.closest('[data-ab]')){$('pfa').classList.toggle('hide');return}
  if(t.closest('[data-lo]')){if(D.user)signOut();else{D.guest=false;save();render()}return}
  if(m&&!t.closest('#pfm'))m.classList.add('hide')});
(async()=>{try{const sp=new URLSearchParams(location.search),c=sp.get('code'),st=sp.get('state');if(!c)return;
  let ok=false;try{ok=!!st&&st===sessionStorage.getItem('ig-st')}catch(e){}
  history.replaceState(null,'',location.pathname+'#connect');
  if(!ok){IGERR='Instagram login could not be verified. Please tap Continue with Instagram again.';return}
  const r=await fetch(API_BASE+'/ig/callback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c,redirect_uri:RU})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){IGERR='Instagram error ('+(j.step||j.error||r.status)+'): '+String(j.detail||j.hint||'').slice(0,300);return}
  D.conn=true;D.demo=false;D.autos=[];D.ig={u:String(j.username),name:String(j.name||''),pic:/^https:\/\//.test(j.pic||'')?j.pic:''};D.sess=j.session;save();await loadReels();location.hash='reels';
}catch(e){IGERR='Could not reach the server. Please try again.'}finally{render()}})();
if(D.sess&&!D.demo)loadReels().then(()=>render());
window.addEventListener('hashchange',()=>render());render();
</script></body></html>
