<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aarix Auto DM</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#2563eb;--ig:linear-gradient(90deg,#e91e8c,#a855f7);--ok:#16a34a;--chip:#e8efff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#171b24;--text:#f3f4f6;--mute:#9ca3af;--line:#262c38;--chip:#1e2a52}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#171b24;--text:#f3f4f6;--mute:#9ca3af;--line:#262c38;--chip:#1e2a52}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
nav.top{display:flex;align-items:center;gap:12px;padding:12px max(12px,calc(50% - 520px));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin-right:auto;white-space:nowrap}
.lg{width:32px;height:32px;border-radius:10px;background:var(--ig);display:grid;place-items:center;flex:none}
nav.top a.l{font-size:13px;color:var(--mute)}@media(max-width:420px){.logo{font-size:15px}.lg{width:28px;height:28px}}
.btn{border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:var(--acc);color:#fff;display:inline-block;white-space:nowrap;text-align:center}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.ig{background:var(--ig);box-shadow:0 8px 22px rgba(233,30,140,.3)}.btn.big{padding:15px 30px;font-size:16px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px}
.hero{text-align:center;padding:44px 0 28px}.hero h1{font-size:clamp(32px,7vw,56px);line-height:1.08;margin:14px 0;letter-spacing:-.02em}.hero p{color:var(--mute);max-width:540px;margin:0 auto 24px;font-size:16px}
.grad{background:var(--ig);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;background:var(--chip);color:var(--acc);font-weight:700;font-size:12px;padding:5px 12px;border-radius:99px}
.sub{color:var(--mute);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.tint{background:var(--chip)}
.card h3{margin:6px 0 4px;font-size:15px}.card p{margin:0;font-size:13px;color:var(--mute)}
.ic{width:40px;height:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:20px}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
h2.s{font-size:24px;margin:40px 0 16px;text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:700;background:var(--chip);color:var(--acc);padding:2px 10px;border-radius:99px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}summary{cursor:pointer;font-weight:600;font-size:14px}details p{color:var(--mute);font-size:13px;margin:8px 0 0}
.pm{width:270px;max-width:100%;margin:0 auto;background:var(--card);border:8px solid #111;border-radius:36px;padding:12px;box-shadow:0 24px 60px rgba(37,99,235,.18)}
.pm .hd{display:flex;gap:8px;align-items:center;font-size:12px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}.av{width:30px;height:30px;border-radius:50%;background:var(--ig)}
.bub{max-width:85%;padding:8px 12px;border-radius:16px;font-size:13px;margin:6px 0}.me{background:var(--line);margin-left:auto}.bot{background:var(--acc);color:#fff}
.lnk{display:block;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;max-width:85%;background:var(--card)}
.pm .bub,.pm .lnk{opacity:0;animation:pop .5s forwards}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.d1{animation-delay:.4s!important}.d2{animation-delay:1.3s!important}.d3{animation-delay:2.2s!important}.d4{animation-delay:3s!important}
@media(prefers-reduced-motion:reduce){.pm .bub,.pm .lnk{animation:none;opacity:1}}
.app{display:flex;flex-direction:column;min-height:100vh}
.side{display:flex;gap:4px;padding:8px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.side a{padding:8px 12px;border-radius:10px;font-size:13px;color:var(--mute);white-space:nowrap}.side a.on{background:var(--chip);color:var(--acc);font-weight:700}.side .logo{padding:4px 10px;margin:0;color:var(--text)}
@media(min-width:800px){.app{flex-direction:row}.side{flex-direction:column;width:220px;min-height:100vh;border-right:1px solid var(--line);border-bottom:0;position:sticky;top:0;align-self:flex-start;height:100vh}.side .logo{margin-bottom:10px}}
.main{flex:1;padding:18px 16px;max-width:900px;width:100%}.main h1{margin:0 0 4px;font-size:24px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
input[type=text],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-size:14px}textarea{min-height:84px;resize:vertical}
.ctr{text-align:center;color:var(--acc);font-weight:600}
.tog{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;flex:none}.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--acc)}.tog.on::after{left:20px}
.stat{font-size:28px;font-weight:800}.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:10px 0 22px}.bars div{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-height:4px;position:relative}.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mute)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.li small{display:block;color:var(--mute)}.li:last-child{border-bottom:0}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:20px;font-size:13px}.two{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:800px){.two{grid-template-columns:1.3fr 1fr}}
.hide{display:none!important}.mod{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}@media(min-width:600px){.mod{align-items:center}.sheet{border-radius:18px}}
.rg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:14px}.rt{aspect-ratio:9/14;border-radius:14px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff;font-size:12px;overflow:hidden}.rt b{font-size:13px;display:block}
.plus{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;color:var(--acc);font-size:24px;font-weight:700;cursor:pointer;line-height:1}.plus.on{background:var(--ok);color:#fff;font-size:14px}.ptag{position:absolute;top:10px;left:10px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px}
.wz{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}.wh{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);background:var(--card)}.wh>*{max-width:560px;margin-left:auto;margin-right:auto}
.wb{flex:1;overflow:auto;padding:16px;width:100%;max-width:592px;margin:0 auto}.wb h2{margin:4px 0 14px;font-size:22px}
.wf{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);justify-content:center}.wf .btn{flex:1;max-width:280px;padding:14px}
.pg{display:flex;gap:6px;margin:10px auto 6px}.pg i{flex:1;height:6px;border-radius:9px;background:var(--line)}.pg i.on{background:var(--acc)}
.rc{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;background:var(--card)}.rc.on{border-color:var(--acc);background:var(--chip)}.rt2{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:var(--chip);padding:3px 10px;border-radius:99px;font-size:13px}.chip b{cursor:pointer;margin-left:6px;color:var(--mute)}
.pv{display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:10px}.th{width:44px;height:56px;border-radius:8px;flex:none}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dash{width:100%;margin-top:12px;border:2px dashed var(--line);background:none;color:var(--acc)}
.ft{border-top:1px solid var(--line);margin-top:30px;padding:28px 16px;text-align:center;color:var(--mute);font-size:12px}.fg{display:flex;gap:24px;justify-content:center;margin-bottom:14px;font-size:13px}
.gb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:16px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ua{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--ig);color:#fff;display:inline-grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.err{color:#dc2626;font-size:13px;margin-top:10px;text-align:center}
</style></head><body><div id="root"></div>
<script>
/* ===== SETUP =====
   GOOGLE_CLIENT_ID: paste your Google OAuth Web Client ID here (see the setup sheet on the login screen).
   APP_ID: your Instagram/Meta app ID (needs a real backend to work). */
const GOOGLE_CLIENT_ID='';
const APP_ID='';
const MAXF=20*1024*1024; /* 20 MB upload limit */
const $=i=>document.getElementById(i),NL='\n',RU=location.origin+location.pathname;
let D={conn:false,demo:false,user:null,guest:false,autos:[],subs:[],bcs:[],dms:0,clicks:0};
try{Object.assign(D,JSON.parse(localStorage.getItem('adm3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('adm3',JSON.stringify(D))}catch(e){}};
try{const th=localStorage.getItem('adm-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;max-width:90%;white-space:pre-line;text-align:center';document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
const LOGO='<i class="lg"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.2 3.6a.6.6 0 0 1-1-.5V16A2.5 2.5 0 0 1 4 13.5z" fill="#fff"/><path d="M12.8 5.6 8.8 10.4h2.6l-.9 4 4.3-5h-2.7z" fill="#e91e8c"/></svg></i>';
const REELS=[['How to get your free guide',48200,1204],['My morning routine',12400,312],['New course launch',9800,540],['Behind the scenes',7300,96],['Limited offer today',31000,880],['Q&A: your questions',5200,210],['Student results',15600,402],['Quick tutorial',22100,655]];
const rgrad=i=>{const h=300+i*7;return `linear-gradient(160deg,hsl(${h},75%,58%),hsl(${h+30},70%,28%))`};
const PV={};let NEWF=[];
const idb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('adm-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const idbDo=(m,id,v)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('f',m=='get'?'readonly':'readwrite'),s=tx.objectStore('f'),r=m=='put'?s.put(v,id):m=='get'?s.get(id):s.delete(id);tx.oncomplete=()=>res(r.result);tx.onerror=tx.onabort=()=>rej(tx.error||new Error('idb'))}));
const dropFile=f=>{if(f&&f.id){idbDo('del',f.id).catch(()=>{});if(PV[f.id]){URL.revokeObjectURL(PV[f.id]);delete PV[f.id]}}};
const fmtB=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const FEATS=[['💬','Comment to DM','Send a DM the moment someone comments your keyword on a reel or post.'],['🔒','Follow Gate','Ask people to follow first. Followers get the link right away.'],['🔁','Public Replies','Reply to matching comments with a random template.'],['🔗','Links and Files','Deliver links, images, PDFs, voice notes and videos in the DM.'],['🎯','Keyword Matching','Match specific words, any word, or skip words with !word.'],['⏰','Follow-up DM','Re-engage people who did not tap after 24 hours.'],['👥','Subscribers','See everyone who interacted with your automations.'],['📣','Broadcasts','Send one message to all your subscribers.']];
const FAQ=[['Which account do I need?','An Instagram Business or Creator account.'],['Is it safe for my account?','It uses the official Instagram API, never asks for your password, and keeps sending within Meta’s limits.'],['How does Comment-to-DM work?','Instagram allows one private reply per comment, within 7 days of the comment.'],['Can I use Hindi or Hinglish keywords?','Yes. Add each spelling as a separate keyword.'],['Can I send files?','Yes. Attach an image, PDF, voice note or video up to 20 MB, or paste a link.']];
const fc=n=>`<div class="grid">${FEATS.slice(0,n||8).map(f=>`<div class="card"><div class="ic">${f[0]}</div><h3>${f[1]}</h3><p>${f[2]}</p></div>`).join('')}</div>`;
const faq=n=>FAQ.slice(0,n).map(q=>`<details><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('');
const nav=()=>`<nav class="top"><a class="logo" href="#home">${LOGO}Aarix Auto DM</a><a class="l" href="#features">Features</a><a class="l" href="#faq">FAQ</a>${D.conn?'<a class="btn sm" href="#reels">My Reels</a>':'<a class="btn sm ig" href="#connect">Connect</a>'}${D.user?`<a class="l" href="#settings" title="${esc(D.user.name)}">${D.user.pic?`<img class="ua" src="${esc(D.user.pic)}" alt="" referrerpolicy="no-referrer">`:`<span class="ua">${esc((D.user.name||'U')[0].toUpperCase())}</span>`}</a>`:''}</nav>`;
const foot=()=>`<footer class="ft"><div class="fg"><a href="#features">Features</a><a href="#faq">FAQ</a><a href="#connect">Connect</a></div>© 2026 Aarix Auto DM</footer>`;
const PHONE=`<div class="pm"><div class="hd"><div class="av"></div><div><b>yourbrand</b><br><span class="sub">● Active now</span></div></div><div class="bub me d1">LINK</div><div class="bub bot d2">Hi Rahul! 👋 Here is your free guide 👇</div><span class="lnk d3">🔗 Open guide</span><div class="bub bot d4" style="margin-top:6px">✓ Delivered</div></div>`;
const P={},B={};

let gsiP;const gsiLoad=()=>gsiP||(gsiP=new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.id)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=()=>res();s.onerror=()=>{gsiP=null;rej(new Error('gsi'))};document.head.appendChild(s)}));
function onGoogle(r){try{let b=r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');b+='='.repeat((4-b.length%4)%4);const j=JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
if(j.aud!==GOOGLE_CLIENT_ID)throw new Error('aud');
D.user={name:j.name||j.email||'User',email:j.email||'',pic:/^https:\/\//.test(j.picture||'')?j.picture:'',sub:j.sub};D.guest=false;save();toast('Signed in as '+D.user.name);render()}catch(e){toast('Google sign-in failed. Please try again.')}}
function signOut(){try{google.accounts.id.disableAutoSelect()}catch(e){}D.user=null;D.guest=false;save();if(location.hash!='#home')location.hash='home';render()}
const DEV=/^(localhost|127\.0\.0\.1|)$/.test(location.hostname)||/[?&]dev=1/.test(location.search);
const GSET=`<div id="gset" class="mod hide"><div class="sheet">${DEV?`<div style="text-align:center"><b style="font-size:20px">Developer setup: Google login</b></div><p class="sub" style="margin-top:10px">Only you (the developer) see this. Visitors on your live site will see a simple message instead.</p><div class="card" style="margin-top:12px"><b>Steps</b><ol class="sub" style="margin:8px 0 0;padding-left:18px"><li>Google Cloud Console → APIs &amp; Services → Credentials.</li><li>Create Credentials → OAuth client ID → <b>Web application</b>.</li><li>Under <b>Authorized JavaScript origins</b> add your live site URL (for example https://yoursite.com). Opening this file directly (file://) will not work.</li><li>Paste the Client ID into <b>GOOGLE_CLIENT_ID</b> at the top of the &lt;script&gt;.</li></ol></div>`:`<div style="text-align:center"><b style="font-size:20px">Google login is unavailable right now</b></div><p class="sub" style="margin-top:10px;text-align:center">Please try again later, or continue as a guest to look around.</p>`}<div class="row" style="margin-top:12px"><button class="btn sec" id="gsc">Close</button></div></div></div>`;
P.login=()=>`<div class="wrap" style="max-width:420px;padding-top:6vh"><div style="text-align:center;margin-bottom:18px"><div class="logo" style="justify-content:center;font-size:22px;margin:0 0 10px">${LOGO}Aarix Auto DM</div><h1 style="margin:8px 0;font-size:26px">Welcome 👋</h1><p class="sub">Sign in to set up your Instagram comment-to-DM automations.</p></div><div class="card" style="padding:22px 18px"><div id="gbtn" style="display:flex;justify-content:center"></div><button class="gb" id="gfb"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button><div id="gerr" class="err hide"></div><div class="or">or</div><button class="btn sec" id="gst" style="width:100%">Continue as guest (demo)</button><p class="sub" style="text-align:center;margin:14px 0 0">Google only shares your name, email and photo. Your Google password is never seen by this site.</p></div></div>${GSET}`;
B.login=()=>{const fb=$('gfb'),er=$('gerr');$('gst').onclick=()=>{D.guest=true;save();render()};$('gsc').onclick=()=>$('gset').classList.add('hide');
if(!GOOGLE_CLIENT_ID){
  fb.classList.remove('hide');
  fb.onclick=()=>{$('gset').classList.remove('hide');};
  return;
}
fb.classList.add('hide');
gsiLoad().then(()=>{
  const g=$('gbtn'); if(!g)return;
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogle,auto_select:false, cancel_on_tap_outside:true});
  google.accounts.id.renderButton(g,{theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:Math.min(360,Math.max(200,g.clientWidth||300))});
}).catch(()=>{
  fb.classList.remove('hide');
  fb.onclick=()=>{
    er.textContent='Google sign-in could not load. Check your internet connection and make sure this website URL is listed in Google Cloud Console.';
    er.classList.remove('hide');
